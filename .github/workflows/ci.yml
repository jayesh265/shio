name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
        install: [".[regulated,pdf]"]
        include:                       # a plain `pip install shio-lang`: the extra-only tests skip, the rest must pass
          - python: "3.12"
            install: "."
          - python: "3.12"               # with the Microsoft Agent Governance Toolkit backend
            install: ".[regulated,pdf,agt]"
    name: python ${{ matrix.python }} (${{ matrix.install }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "${{ matrix.install }}" pytest
      - run: pytest -q
      - name: every example compiles (except the one written to fail)
        run: for f in examples/*.shio examples/*/*.shio; do case "$f" in *_unsafe.shio) ;; *) shio check "$f";; esac; done
      - name: Shio Guard - every pack validates, fixtures run
        if: matrix.install != '.'
        run: shio pack validate
      - name: Shio Guard - pre-model gate fixtures, mutation tests and no-bypass lint
        if: matrix.install != '.'
        run: shio preflight fixtures && shio preflight lint shio examples --allow shio/models.py && shio attack run --k 3 --budget 150
      - name: Shio Guard - licence and dependency policy
        if: matrix.install != '.'
        run: |
          shio licences check --extra regulated --extra pdf
          case "${{ matrix.install }}" in *agt*) shio licences check --extra agt;; esac
      - name: Shio Guard - red-team suite from every pack's adversarial fixtures
        if: matrix.install != '.'
        run: shio pack redteam -o /tmp/redteam.json && shio eval /tmp/redteam.json
      - name: Shio Guard - reference agents build, prove their controls and meet their eval gates
        if: matrix.install != '.'
        env:
          SHIO_SIGNING_KEY: hmac:ci-only
        run: |
          for d in examples/medical/referral examples/medical/trial; do
            (cd $d && shio check *.shio && shio registry scan agent.json -o /tmp/card.json && shio assess --manifest agent.json)
          done
          (cd examples/medical/referral && for s in regression redteam grounding; do shio eval evals/$s.json; done)
          (cd examples/medical/trial && shio eval evals/eligibility.json)
      - name: the inbox example compiles only in its safe form
        run: |
          cd examples/injection
          shio run inbox.shio replay | grep HELD
          ! shio check inbox_unsafe.shio

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: the wheel installs and runs on its own
        run: |
          python -m venv /tmp/w && /tmp/w/bin/pip install dist/*.whl
          cd examples/injection && /tmp/w/bin/shio run inbox.shio replay | grep HELD

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      - run: mkdocs build --strict

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pydantic
      - name: VS Code's Python grammar, for the grammar tests
        run: curl -sfL https://raw.githubusercontent.com/microsoft/vscode/main/extensions/python/syntaxes/MagicPython.tmLanguage.json -o /tmp/MagicPython.tmLanguage.json
      - run: npm install && npm test
        working-directory: editors/vscode
        env:
          MAGICPYTHON: /tmp/MagicPython.tmLanguage.json
