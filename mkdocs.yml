site_name: Shio
site_description: A language for AI agents in which the model reads, code decides, and people approve.
site_url: https://pratikkp24.github.io/shio/
repo_url: https://github.com/pratikkp24/shio
repo_name: pratikkp24/shio
edit_uri: edit/main/docs/
copyright: Aonami Labs · MIT OR Apache-2.0
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}
  features: [content.code.copy, navigation.sections, navigation.top, search.highlight]
markdown_extensions: [admonition, tables, {toc: {permalink: true}}, pymdownx.highlight, pymdownx.superfences, {pymdownx.tabbed: {alternate_style: true}}]
exclude_docs: |
  *.mp4
  *.tape
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Shio Guard: guard.md
  - Models: models.md
  - Traces in production: traces.md
  - Regulated decisions: REGULATED.md
  - Harness (experimental): harness.md
  - Durable execution (experimental): durable.md
  - Shio Guard governance:
      - Overview and deliverables: governance/README.md
      - "D1: Decision record": governance/D1-decisions.md
      - "D2: Pack format": governance/D2-pack-format.md
      - "D3: Adapter interface": governance/D3-adapter-interface.md
      - "D4: Licence policy": governance/D4-licence-policy.md
      - "D16: Free-text options": governance/D16-free-text-options.md
      - The live monitor: governance/monitor.md
      - "Pre-model gate and policy packs": governance/preflight.md
      - Coverage matrix: governance/coverage.md
      - "Product requirements: traceability": governance/requirements.md
      - API stability: STABILITY.md
      - "Microsoft Agent Governance Toolkit": governance/microsoft-agt.md
      - Contributing a pack: governance/CONTRIBUTING-packs.md
      - Release checklist: governance/RELEASE-1.0-CHECKLIST.md
      - "Research: DPDP Act": governance/research/dpdp.md
      - "Research: CDSCO": governance/research/cdsco.md
  - Public API: API.md
